# cloudbuild.yaml
steps:
  # Esta etapa constrói a imagem a partir do Dockerfile localizado no subdiretório hp-ingestion
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/hp-ingestion-image',
      './hp-ingestion'
    ]
  # Esta etapa faz o deploy da imagem construída no Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'hp-ingestion-runner',
      '--image', 'gcr.io/$PROJECT_ID/hp-ingestion-image',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--no-allow-unauthenticated', # Não permite acesso sem autenticação (Melhor prática)
      '--execution-environment', 'gen2',
      '--timeout', '540',
      '--set-env-vars', 'INSTANCE_ID=hp-instance-global,DATABASE_ID=hp-database,GCP_PROJECT=$PROJECT_ID,REGION=us-central1'
    ]
images:
  - 'gcr.io/$PROJECT_ID/hp-ingestion-image'
