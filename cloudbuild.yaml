# cloudbuild.yaml (Na raiz do repositório hp/)

steps:
# 1. Constrói a imagem Docker a partir do subdiretório hp-ingestion
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'gcr.io/$PROJECT_ID/hp-ingestion-image',
    './hp-ingestion'
  ]
# 2. Faz o deploy da imagem no Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args: [
    'run', 'deploy', 'hp-ingestion-runner',
    '--image', 'gcr.io/$PROJECT_ID/hp-ingestion-image',
    '--region', 'us-central1',
    '--platform', 'managed',
    '--allow-unauthenticated', 
    '--timeout', '540',
    '--memory', '512Mi',
    '--set-env-vars', 'INSTANCE_ID=demo-hp,DATABASE_ID=hp-database,GCP_PROJECT=$PROJECT_ID,REGION=us-central1'
  ]
images:
  - 'gcr.io/$PROJECT_ID/hp-ingestion-image'
